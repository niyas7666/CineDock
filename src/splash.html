<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CineDock</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; overflow: hidden; color: #edf0f4; background: radial-gradient(circle at 50% 8%, #333a47 0, #1b1f26 42%, #111318 100%); font-family: "Segoe UI", Arial, sans-serif; }
    main { display: grid; justify-items: center; gap: 12px; text-align: center; }
    img { width: 82px; height: 82px; filter: drop-shadow(0 8px 22px #0008); }
    h1 { margin: 2px 0 0; font-size: 27px; font-weight: 650; letter-spacing: .2px; }
    p { margin: 0; color: #aeb6c2; font-size: 13px; }
    .bar { width: 178px; height: 3px; overflow: hidden; border-radius: 3px; background: #4a515d; }
    .bar::after { content: ""; display: block; width: 44%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #f06d16, #ffb347); animation: load 1s ease-in-out infinite alternate; }
    @keyframes load { to { transform: translateX(133px); } }
  </style>
</head>
<body>
  <main>
    <img src="assets/cinedock.svg" alt="CineDock">
    <h1>CineDock</h1>
    <p>Preparing your media library…</p>
    <div class="bar" aria-hidden="true"></div>
  </main>
</body>
</html>
